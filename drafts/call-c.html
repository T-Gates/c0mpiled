<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 C — 검사 모드 확대</title>
<style>
  :root { --bg:#1a1d22; --tile:#262b33; --line:#363d49; --ink:#f0f2f5; --muted:#a0a9b6; --accent:#2f6fde; --ok:#24a05a; --bad:#d94a3d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .draftbar { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; gap:6px; align-items:center; padding:6px 10px; background:#fff8d6; color:#5a4a00; font-size:12px; border-bottom:1px solid #e6d58a; }
  .draftbar b { margin-right:6px; }
  .draftbar button { font:inherit; border:1px solid #d9c56c; background:#fff; border-radius:6px; padding:3px 8px; cursor:pointer; }
  .draftbar button.on { background:#5a4a00; color:#fff; border-color:#5a4a00; }
  .screen { display:none; position:fixed; inset:30px 0 0 0; }
  .screen.on { display:flex; }
  .video { position:relative; background:radial-gradient(circle at 50% 42%, #4f5a6a 0, #2b323c 62%); overflow:hidden; border-radius:14px; }
  .video svg.person { position:absolute; left:50%; bottom:0; transform:translateX(-50%); height:78%; }
  .tint { position:absolute; inset:0; mix-blend-mode:soft-light; opacity:0; }
  .name { position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.55); padding:4px 9px; border-radius:7px; font-size:13px; }
  input, select { font:inherit; font-size:15px; color:var(--ink); background:var(--tile); border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  .btn { font:inherit; font-size:15px; font-weight:600; border:0; border-radius:10px; padding:12px 16px; cursor:pointer; color:#fff; background:var(--accent); }
  .btn:disabled { background:#2f3642; color:#6f7a8a; cursor:not-allowed; }

  /* 로비: 한 줄 흐름 */
  #lobby { align-items:center; justify-content:center; }
  .lobby { width:380px; max-width:92vw; display:flex; flex-direction:column; gap:14px; }
  .lobby h1 { margin:0 0 4px; font-size:22px; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; background:var(--tile); border-radius:10px; padding:4px; }
  .tabs button { font:inherit; font-size:14px; border:0; background:transparent; color:var(--muted); padding:9px; border-radius:8px; cursor:pointer; }
  .tabs button.on { background:#3a4250; color:var(--ink); font-weight:600; }
  .lobby .prev { aspect-ratio:16/9; }
  .lobby .warn { font-size:12px; color:#e2b65c; line-height:1.5; }

  /* 통화 */
  #call { flex-direction:column; }
  .gallery { flex:1; display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:16px; align-content:center; transition:all .25s; }
  .tile { aspect-ratio:4/3; }
  /* 검사 모드: 대상만 크게, 나머지는 오른쪽 작게 */
  #call.inspect .gallery { grid-template-columns:3fr 1fr; grid-template-rows:1fr 1fr; align-content:stretch; }
  #call.inspect .tile { aspect-ratio:auto; }
  #call.inspect #c1 { grid-row:1 / 3; grid-column:1; }
  #call.inspect #c0, #call.inspect #c2 { opacity:.45; }
  .roi { display:none; }
  #call.inspect .roi { display:block; }
  .ihead { position:absolute; left:14px; top:14px; display:none; flex-direction:column; gap:6px; }
  #call.inspect .ihead { display:flex; }
  .ihead .t { background:rgba(0,0,0,.65); padding:6px 11px; border-radius:8px; font-size:14px; font-weight:600; }
  .count { font-size:44px; font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,.6); }

  .toolbar { display:flex; align-items:center; gap:10px; padding:12px 16px 16px; border-top:1px solid var(--line); }
  .toolbar .grp { display:flex; gap:8px; }
  .tb { font:inherit; font-size:13px; background:var(--tile); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 13px; cursor:pointer; }
  .judgebox { margin:0 auto; display:flex; gap:8px; align-items:center; background:#20252d; border:1px solid var(--line); border-radius:12px; padding:6px; }
  .judgebox span { font-size:13px; color:var(--muted); padding-left:8px; }
  .judgebox select { padding:9px 10px; min-width:140px; }
  .leave { background:var(--bad); border-color:var(--bad); }

  /* 결과 서랍 */
  .drawer { display:none; background:#fff; color:#1c2330; border-radius:16px 16px 0 0; padding:16px 20px; gap:24px; align-items:center; }
  .drawer.on { display:flex; }
  .drawer .v { font-size:20px; font-weight:800; color:var(--ok); }
  .drawer .v small { display:block; font-size:12px; font-weight:400; color:#5b6577; margin-top:2px; }
  .drawer table { border-collapse:collapse; font-size:13px; }
  .drawer td, .drawer th { padding:4px 12px; border-bottom:1px solid #e6e9ee; text-align:left; }
  .drawer th { color:#5b6577; font-weight:500; }
  .drawer .x { margin-left:auto; font:inherit; background:#eef0f3; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; }

  #flash { flex-direction:column; align-items:center; justify-content:center; background:#f00; }
  #flash .msg { background:rgba(0,0,0,.6); color:#fff; padding:14px 22px; border-radius:16px; text-align:center; }
  #flash .msg b { display:block; font-size:40px; }
</style>
</head>
<body>
<div class="draftbar"><b>시안 C · 검사 모드 확대</b>
  <button data-s="lobby">1 로비</button>
  <button data-s="call" data-m="idle">2 호스트 통화</button>
  <button data-s="call" data-m="sel">3 참여자 선택</button>
  <button data-s="call" data-m="run">4 판정 중</button>
  <button data-s="call" data-m="done">5 결과</button>
  <button data-s="flash">6 참여자가 보는 플래시</button>
  <a href="index.html" style="margin-left:auto;color:#5a4a00">← 시안 목록</a>
</div>

<section class="screen" id="lobby">
  <div class="lobby">
    <h1>Human Check 통화</h1>
    <div class="video prev"><svg class="person" viewBox="0 0 100 100"><circle cx="50" cy="34" r="18" fill="#8d99ab"/><path d="M14 100 Q14 62 50 62 Q86 62 86 100Z" fill="#8d99ab"/></svg><div class="name">미리보기 · 🎤 켜짐 · 📷 켜짐</div></div>
    <input value="준형" aria-label="이름" />
    <div class="tabs"><button class="on" id="tabNew">방 만들기</button><button id="tabJoin">방 참여하기</button></div>
    <input id="code" placeholder="방 코드 (예: ab12)" style="display:none" />
    <button class="btn" id="go">방 만들기</button>
    <div class="warn">참여자는 호스트가 판정을 누르면 화면 전체가 약 3초 동안 색이 바뀝니다. 광과민성 발작 위험이 있으면 참여하지 마세요.</div>
  </div>
</section>

<section class="screen" id="call">
  <div class="gallery">
    <div class="video tile" id="c0"><svg class="person" viewBox="0 0 100 100"><circle cx="50" cy="34" r="18" fill="#8d99ab"/><path d="M14 100 Q14 62 50 62 Q86 62 86 100Z" fill="#8d99ab"/></svg><div class="name">준형 (나 · 호스트)</div></div>
    <div class="video tile" id="c1">
      <svg class="person" viewBox="0 0 100 100"><circle cx="50" cy="34" r="18" fill="#a8977f"/><path d="M14 100 Q14 62 50 62 Q86 62 86 100Z" fill="#a8977f"/><g class="roi" fill="none" stroke="#fff" stroke-width=".6" stroke-dasharray="1.5 1"><circle cx="43" cy="38" r="3.5"/><circle cx="57" cy="38" r="3.5"/><circle cx="50" cy="25" r="3.5"/></g></svg>
      <div class="tint"></div>
            <div class="ihead"><span class="t" id="itxt">민지 판정 중 · 초록</span><span class="count" id="icount">2</span></div>
      <div class="name">민지</div>
    </div>
    <div class="video tile" id="c2"><svg class="person" viewBox="0 0 100 100"><circle cx="50" cy="34" r="18" fill="#7f95a8"/><path d="M14 100 Q14 62 50 62 Q86 62 86 100Z" fill="#7f95a8"/></svg><div class="name">도윤 🔇</div></div>
  </div>
  <div class="drawer" id="drawer">
    <div class="v">✓ 민지 · 사람 확인됨<small>얼굴 반사 3색 모두 기준(0.004) 이상</small></div>
    <table>
      <tr><th>색</th><th>얼굴 Δ</th><th>손 Δ</th><th>결과</th></tr>
      <tr><td>빨강</td><td>0.012</td><td>0.024</td><td>✓</td></tr>
      <tr><td>초록</td><td>0.010</td><td>—</td><td>✓</td></tr>
      <tr><td>파랑</td><td>0.007</td><td>0.015</td><td>✓</td></tr>
    </table>
    <button class="x" id="closeD">닫기</button>
  </div>
  <div class="toolbar">
    <div class="grp"><button class="tb">🎤 마이크</button><button class="tb">📷 카메라</button><button class="tb">초대 주소</button></div>
    <div class="judgebox">
      <span>대상</span>
      <select id="who"><option value="">참여자 선택</option><option value="1">민지</option><option value="2">도윤</option></select>
      <button class="btn" id="judgeBtn" disabled>딥페이크 판정</button>
    </div>
    <div class="grp"><button class="tb leave">나가기</button></div>
  </div>
</section>

<section class="screen" id="flash"><div class="msg">호스트가 사람 확인 중<b id="fc">3</b>화면을 바라봐 주세요</div></section>

<script>
const $ = (s) => document.querySelector(s);
function mode(m) {
  const call = $('#call');
  call.classList.toggle('inspect', m === 'run' || m === 'done');
  $('#who').value = m === 'idle' ? '' : '1';
  $('#judgeBtn').disabled = m === 'idle' || m === 'run';
  $('#drawer').classList.toggle('on', m === 'done');
  $('#c1 .tint').style.background = '#0f0';
  $('#c1 .tint').style.opacity = m === 'run' ? .55 : 0;
  $('#itxt').textContent = m === 'done' ? '민지 판정 완료' : '민지 판정 중 · 초록 (4/6)';
  $('#icount').style.display = m === 'run' ? '' : 'none';
}
let ft;
function show(s, m) {
  document.querySelectorAll('.screen').forEach((e) => e.classList.toggle('on', e.id === s));
  document.querySelectorAll('.draftbar button').forEach((b) => b.classList.toggle('on', b.dataset.s === s && (b.dataset.m || '') === (m || '')));
  clearInterval(ft);
  if (s === 'call') mode(m);
  if (s === 'flash') {
    const c = ['#fff', '#f00', '#fff', '#0f0', '#fff', '#00f']; let i = 0; $('#flash').style.background = c[0]; $('#fc').textContent = 3;
    ft = setInterval(() => { i = (i + 1) % 6; $('#flash').style.background = c[i]; $('#fc').textContent = 3 - Math.floor(i / 2); }, 500);
  }
}
document.querySelectorAll('.draftbar button').forEach((b) => b.onclick = () => show(b.dataset.s, b.dataset.m));
$('#who').onchange = () => show('call', $('#who').value ? 'sel' : 'idle');
$('#judgeBtn').onclick = () => { show('call', 'run'); setTimeout(() => show('call', 'done'), 1800); };
$('#closeD').onclick = () => show('call', 'sel');
$('#tabNew').onclick = () => { $('#tabNew').classList.add('on'); $('#tabJoin').classList.remove('on'); $('#code').style.display = 'none'; $('#go').textContent = '방 만들기'; };
$('#tabJoin').onclick = () => { $('#tabJoin').classList.add('on'); $('#tabNew').classList.remove('on'); $('#code').style.display = ''; $('#go').textContent = '참여하기'; };
{ const [s, m] = (location.hash.slice(1) || 'lobby').split(':'); show(s, m); }
</script>
</body>
</html>
