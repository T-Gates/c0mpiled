<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 A — 다크 갤러리</title>
<style>
  :root { --bg:#14171c; --tile:#22272f; --line:#323946; --ink:#eef1f5; --muted:#9aa4b2; --accent:#3b7bf0; --ok:#2fa865; --bad:#e0564a; --warn:#d99a2b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  /* 시안 전환 바 (시안 확인용, 실제 화면 아님) */
  .draftbar { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; gap:6px; align-items:center; padding:6px 10px; background:#fff8d6; color:#5a4a00; font-size:12px; border-bottom:1px solid #e6d58a; }
  .draftbar b { margin-right:6px; }
  .draftbar button { font:inherit; border:1px solid #d9c56c; background:#fff; border-radius:6px; padding:3px 8px; cursor:pointer; }
  .draftbar button.on { background:#5a4a00; color:#fff; border-color:#5a4a00; }
  .screen { display:none; position:fixed; inset:30px 0 0 0; }
  .screen.on { display:flex; }

  /* 공통: 가짜 영상 */
  .video { position:relative; background:radial-gradient(circle at 50% 42%, #4a5566 0, #2a313b 60%); overflow:hidden; }
  .video svg.person { position:absolute; left:50%; bottom:0; transform:translateX(-50%); height:78%; opacity:.9; }
  .tint { position:absolute; inset:0; mix-blend-mode:soft-light; opacity:0; transition:opacity .2s; }

  /* 로비 */
  #lobby { align-items:center; justify-content:center; gap:28px; padding:24px; flex-wrap:wrap; }
  .lobby-prev { width:420px; max-width:100%; aspect-ratio:4/3; border-radius:16px; }
  .lobby-prev .ctrls { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
  .lobby-card { width:340px; max-width:100%; display:flex; flex-direction:column; gap:14px; }
  .lobby-card h1 { margin:0; font-size:24px; }
  .lobby-card p { margin:0; color:var(--muted); font-size:14px; line-height:1.5; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
  input { width:100%; font:inherit; font-size:15px; color:var(--ink); background:var(--tile); border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  .btn { font:inherit; font-size:15px; font-weight:600; border:0; border-radius:10px; padding:12px 16px; cursor:pointer; color:#fff; background:var(--accent); }
  .btn.ghost { background:var(--tile); border:1px solid var(--line); color:var(--ink); }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  .or { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
  .notice { font-size:12px; color:var(--warn); line-height:1.5; }

  /* 통화 */
  #call { flex-direction:column; }
  .topinfo { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; font-size:13px; color:var(--muted); }
  .topinfo .room { color:var(--ink); font-weight:600; }
  .grid { flex:1; display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:0 16px; align-content:center; }
  .tile { border-radius:14px; aspect-ratio:4/3; border:3px solid transparent; cursor:default; }
  .tile.pick { cursor:pointer; }
  .tile.pick:hover { border-color:#4b5568; }
  .tile.sel { border-color:var(--accent); }
  .name { position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.55); padding:4px 9px; border-radius:7px; font-size:13px; display:flex; gap:6px; align-items:center; }
  .selmark { position:absolute; right:10px; top:10px; background:var(--accent); font-size:12px; font-weight:600; padding:4px 9px; border-radius:7px; display:none; }
  .tile.sel .selmark { display:block; }
  .badge { position:absolute; left:10px; top:10px; font-size:13px; font-weight:700; padding:6px 10px; border-radius:8px; display:none; }
  .badge.ok { background:var(--ok); display:block; }
  .badge.bad { background:var(--bad); display:block; }
  .badge.run { background:rgba(0,0,0,.65); display:block; font-weight:600; }
  .steps { display:flex; gap:3px; margin-top:6px; }
  .steps i { width:18px; height:6px; border-radius:2px; background:#555; }
  .detail { position:absolute; left:10px; top:48px; background:rgba(0,0,0,.7); font-size:12px; line-height:1.6; padding:7px 10px; border-radius:8px; display:none; color:#dde3ea; }
  .detail.on { display:block; }
  .bar { display:flex; justify-content:center; align-items:center; gap:10px; padding:14px 16px 18px; }
  .cbtn { font:inherit; font-size:13px; background:var(--tile); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-width:76px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .cbtn.off { background:#3a2326; border-color:#6b3238; color:#ffb4ad; }
  .cbtn .ic { font-size:18px; line-height:1; }
  .sep { width:1px; height:36px; background:var(--line); margin:0 4px; }
  .judge { font:inherit; font-size:14px; font-weight:700; border:0; border-radius:12px; padding:13px 18px; background:var(--accent); color:#fff; cursor:pointer; }
  .judge:disabled { background:#2b3340; color:#6f7a8a; cursor:not-allowed; }
  .leave { background:var(--bad); border-color:var(--bad); color:#fff; }
  .hint { text-align:center; font-size:12px; color:var(--muted); margin-top:-8px; padding-bottom:8px; }

  /* 참여자 화면: 플래시 */
  #flash { flex-direction:column; align-items:center; justify-content:flex-end; background:#ff0000; transition:background .15s; }
  #flash .pill { margin-bottom:28px; background:rgba(0,0,0,.6); color:#fff; padding:8px 14px; border-radius:999px; font-size:13px; }
</style>
</head>
<body>
<div class="draftbar"><b>시안 A · 다크 갤러리 (Zoom형)</b>
  <button data-s="lobby">1 로비</button>
  <button data-s="call" data-m="idle">2 호스트 통화</button>
  <button data-s="call" data-m="sel">3 참여자 선택</button>
  <button data-s="call" data-m="run">4 판정 중</button>
  <button data-s="call" data-m="done">5 결과</button>
  <button data-s="flash">6 참여자가 보는 플래시</button>
  <a href="index.html" style="margin-left:auto;color:#5a4a00">← 시안 목록</a>
</div>

<!-- 1 로비 -->
<section class="screen" id="lobby">
  <div class="video lobby-prev">
    <svg class="person" viewBox="0 0 100 100"><circle cx="50" cy="34" r="18" fill="#8d99ab"/><path d="M14 100 Q14 62 50 62 Q86 62 86 100Z" fill="#8d99ab"/></svg>
    <div class="ctrls"><button class="cbtn"><span class="ic">🎤</span>마이크</button><button class="cbtn"><span class="ic">📷</span>카메라</button></div>
  </div>
  <div class="lobby-card">
    <h1>Human Check 통화</h1>
    <p>같은 Wi-Fi에 있는 사람과 3인까지 화상통화합니다.</p>
    <div><label>내 이름</label><input value="준형" /></div>
    <button class="btn">방 만들기 (호스트)</button>
    <div class="or">또는</div>
    <div><label>방 코드</label><div class="row"><input placeholder="예: ab12" /><button class="btn ghost">참여하기</button></div></div>
    <div class="notice">참여하면 호스트가 화면 색 깜빡임 확인(약 3초)을 실행할 수 있습니다. 광과민성 발작 위험이 있으면 참여하지 마세요.</div>
  </div>
</section>

<!-- 2~5 통화 -->
<section class="screen" id="call">
  <div class="topinfo"><span>방 <span class="room">ab12</span> · 초대 주소 https://192.168.10.101:8443/?room=ab12 <a href="#" style="color:var(--accent)">복사</a></span><span>호스트 · 3명</span></div>
  <div class="grid">
    <div class="video tile" id="t0">
      <svg class="person" viewBox="0 0 100 100"><circle cx="50" cy="34" r="18" fill="#8d99ab"/><path d="M14 100 Q14 62 50 62 Q86 62 86 100Z" fill="#8d99ab"/></svg>
      <div class="name">준형 (나 · 호스트)</div>
    </div>
    <div class="video tile pick" id="t1">
      <svg class="person" viewBox="0 0 100 100"><circle cx="50" cy="34" r="18" fill="#a8977f"/><path d="M14 100 Q14 62 50 62 Q86 62 86 100Z" fill="#a8977f"/></svg>
      <div class="tint"></div>
      <div class="badge"></div><div class="detail"></div>
      <div class="selmark">선택됨</div>
      <div class="name">민지</div>
    </div>
    <div class="video tile pick" id="t2">
      <svg class="person" viewBox="0 0 100 100"><circle cx="50" cy="34" r="18" fill="#7f95a8"/><path d="M14 100 Q14 62 50 62 Q86 62 86 100Z" fill="#7f95a8"/></svg>
      <div class="badge"></div><div class="detail"></div>
      <div class="selmark">선택됨</div>
      <div class="name">도윤 🔇</div>
    </div>
  </div>
  <div class="bar">
    <button class="cbtn"><span class="ic">🎤</span>마이크</button>
    <button class="cbtn"><span class="ic">📷</span>카메라</button>
    <div class="sep"></div>
    <button class="judge" id="judgeBtn" disabled>딥페이크 판정</button>
    <div class="sep"></div>
    <button class="cbtn leave"><span class="ic">✕</span>나가기</button>
  </div>
  <div class="hint" id="hint">판정할 참여자 화면을 클릭하세요</div>
</section>

<!-- 6 참여자 플래시 -->
<section class="screen" id="flash"><div class="pill">호스트가 사람 확인 중입니다 · 화면을 바라봐 주세요 (3초)</div></section>

<script>
const $ = (s) => document.querySelector(s);
const t1 = $('#t1');
function reset() {
  t1.classList.remove('sel');
  const b = t1.querySelector('.badge'); b.className = 'badge'; b.innerHTML = '';
  t1.querySelector('.detail').classList.remove('on');
  t1.querySelector('.tint').style.opacity = 0;
  $('#judgeBtn').disabled = true; $('#hint').textContent = '판정할 참여자 화면을 클릭하세요';
}
function mode(m) {
  reset();
  if (m === 'idle') return;
  t1.classList.add('sel'); $('#judgeBtn').disabled = false; $('#hint').textContent = '민지 선택됨 · 판정을 누르면 민지 화면에 바로 색 플래시가 뜹니다';
  const b = t1.querySelector('.badge');
  if (m === 'run') {
    $('#judgeBtn').disabled = true; $('#hint').textContent = '판정 중…';
    b.className = 'badge run';
    b.innerHTML = '판정 중 3/6 · 초록<div class="steps"><i style="background:#fff"></i><i style="background:#e33"></i><i style="background:#fff"></i><i style="background:#2c3;outline:2px solid #fff"></i><i></i><i></i></div>';
    const tint = t1.querySelector('.tint'); tint.style.background = '#0f0'; tint.style.opacity = .55;
  }
  if (m === 'done') {
    b.className = 'badge ok'; b.textContent = '✓ 사람 확인됨';
    const d = t1.querySelector('.detail'); d.classList.add('on');
    d.innerHTML = '얼굴 반사 Δ · 빨강 0.012 · 초록 0.010 · 파랑 0.007<br>3색 모두 기준(0.004) 이상';
    const b2 = $('#t2 .badge'); b2.className = 'badge bad'; b2.textContent = '✕ 반사 없음 · 딥페이크 의심';
    $('#hint').textContent = '도윤은 직전 판정 결과 (예시)';
  }
}
let flashTimer;
function show(s, m) {
  document.querySelectorAll('.screen').forEach((e) => e.classList.toggle('on', e.id === s));
  document.querySelectorAll('.draftbar button').forEach((b) => b.classList.toggle('on', b.dataset.s === s && (b.dataset.m || '') === (m || '')));
  clearInterval(flashTimer);
  if (s === 'call') { mode(m); $('#t2 .badge').className = m === 'done' ? 'badge bad' : 'badge'; }
  if (s === 'flash') {
    const seq = ['#fff', '#f00', '#fff', '#0f0', '#fff', '#00f']; let i = 0;
    $('#flash').style.background = seq[0];
    flashTimer = setInterval(() => { i = (i + 1) % seq.length; $('#flash').style.background = seq[i]; }, 500);
  }
}
document.querySelectorAll('.draftbar button').forEach((b) => b.onclick = () => show(b.dataset.s, b.dataset.m));
t1.onclick = () => show('call', 'sel');
$('#judgeBtn').onclick = () => { show('call', 'run'); setTimeout(() => show('call', 'done'), 1800); };
{ const [s, m] = (location.hash.slice(1) || 'lobby').split(':'); show(s, m); }
</script>
</body>
</html>
